# Shared security scanners for every releaseready repo's pr.yml: gitleaks, trivy fs, semgrep and zizmor.
# The caller checks out with fetch-depth: 0 first. Baselines live in the consumer repo (see README):
#   .gitleaks-baseline.json   gitleaks findings accepted today (each is reviewed, never a live secret)
#   .gitleaks.toml            optional gitleaks rules/allowlist
#   .trivyignore              trivy ids with a reason comment on the line above
#   .semgrepignore            paths semgrep skips (with a reason comment)
#   .github/zizmor.yml        zizmor rule config (ignores need a reason comment)
name: releaseready security scan
description: Run gitleaks, trivy fs, semgrep and zizmor. Fails on any finding not in the repo's baseline.
runs:
  using: composite
  steps:
    - name: gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
        mkdir "$RUNNER_TEMP/gitleaks" && tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
        args=(git --redact --no-banner --exit-code 1)
        [ -f .gitleaks-baseline.json ] && args+=(--baseline-path .gitleaks-baseline.json)
        [ -f .gitleaks.toml ] && args+=(--config .gitleaks.toml)
        "$RUNNER_TEMP/gitleaks/gitleaks" "${args[@]}" .
    - name: trivy fs
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scanners: vuln,secret,misconfig
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: "1"
        trivyignores: .trivyignore
    - name: semgrep
      shell: bash
      env:
        SEMGREP_VERSION: 1.186.0
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/semgrep"
        "$RUNNER_TEMP/semgrep/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
        "$RUNNER_TEMP/semgrep/bin/semgrep" scan --config p/default --error --metrics=off --quiet --exclude node_modules
    - name: zizmor
      uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        version: 1.32.0
        advanced-security: false
        online-audits: false
