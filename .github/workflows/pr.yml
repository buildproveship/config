# Light pull request checks: format, typecheck, lint, tests and releaseready-guardrails (owner decision of 18 Nov 2026).
name: Pull request
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # test/hooks.test.js runs the real pre-commit hook, which needs gitleaks.
      - uses: ./.github/actions/install-gitleaks
      - name: Format, typecheck, lint, tests and guardrails
        run: npm run check
      - name: Validate the Renovate preset
        run: npm run renovate:check
  security:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks, trivy, semgrep and zizmor
        uses: ./.github/actions/security-scan
  # The one required status check in branch protection (RRDPLAT-105), the same name every other repo reports.
  # Config keeps its own two jobs because its check needs gitleaks and the security scan; it stays on hosted
  # ubuntu-24.04 as a public repo (the org runner group keeps public repos off rr-local).
  ci:
    needs: [checks, security]
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*|*" skipped "*) echo "A required job did not pass: $RESULTS" >&2; exit 1 ;;
          esac
