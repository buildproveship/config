# Lean CI for every BuildProveShip repo, called from the repo's own pr.yml (see templates/workflows/pr.yml). The local
# hooks (Husky: pre-commit, commit-msg, pre-push) are the first gate; this is the second, so it only has to confirm.
#
# Cost rules (cap: $10/month of GitHub Actions):
#   - drafts are skipped; the caller also triggers on ready_for_review, so marking ready starts the run
#   - docs-only PRs skip checks; `ci` reports success under that policy and logs that checks were not run
#   - one job, not three: every hosted job bills at least one minute, so classify, check and report run as steps of `ci`
#   - one run per PR (cancel-in-progress), dependencies and build output cached
#   - the default runner is GitHub-hosted `ubuntu-24.04` (owner decision, 25 Nov 2026, BPS-105). A repo opts into the
#     self-hosted `rr-local` with `runner: rr-local` (frontend-ui only). Fork PRs never get it: a public repo would
#     otherwise run a stranger's code on the owner's Mac, so they always run on a GitHub-hosted runner.
# Callers grant: permissions: { contents: read, pull-requests: read, packages: read } (packages: npm ci installs
# @buildproveship/config from GitHub Packages, which needs a token even for a public package).
name: Reusable CI
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for same-repo PRs and main. Fork PRs always use ubuntu-24.04.
        type: string
        default: rr-local
      node-version-file:
        type: string
        default: .nvmrc
      check-command:
        description: The one required check; the same command developers run as `npm run check`.
        type: string
        default: npx --no-install releaseready-hooks verify
      docs-only-pattern:
        description: Extended regex; a PR whose changed files all match it skips the checks.
        type: string
        default: '^(.*\.md|docs/.*|LICENSE)$'
      cache-paths:
        description: Build output to cache between runs, one path per line. Empty means no build cache.
        type: string
        default: ""
      cache-key-files:
        description: Build-input glob (including assets/generators outside src when needed). Shared keys also include manifests, npm locks, configs and the Node version file.
        type: string
        default: "src/**"
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # The one required status check (`ci / ci`). Drafts skip it; docs-only changes report the policy exemption.
  ci:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      # Same script as classify-changes.yml (test/ci-classification.test.js fails if they differ). It runs before
      # checkout, so a docs-only PR bills one short job and never installs anything.
      - id: diff
        name: Classify changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PATTERN: ${{ inputs.docs-only-pattern }}
        run: |
          set -euo pipefail
          # Leave a conservative output even if the API or classifier subsequently fails.
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "pull_request" ]; then exit 0; fi
          # Include both ends of renames: moving code into docs does not remove the need for checks.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          if [ -z "$files" ]; then exit 0; fi
          # Consume all input: grep -q could SIGPIPE printf on a long diff.
          if printf '%s\n' "$files" | grep -Ev -- "$PATTERN" > /dev/null; then
            exit 0
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              echo "docs-only classifier failed (grep exit $result); refusing to skip checks" >&2
              exit "$result"
            fi
          fi
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
      - name: Docs-only policy
        if: ${{ steps.diff.outputs.docs_only == 'true' }}
        run: echo "Checks skipped under the configured docs-only policy; checks were not run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.diff.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
          # Full history so `origin/main` exists: a consumer's check-command can compare against the merge target
          # (test-data-management's openapi:check runs `git ls-tree origin/main`). The credential is not kept, so a
          # script cannot fetch it later.
          fetch-depth: 0
      - id: node
        if: ${{ steps.diff.outputs.docs_only != 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@buildproveship"
      - name: Restore build output
        if: ${{ steps.diff.outputs.docs_only != 'true' && inputs.cache-paths != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          # Invalidate on build configuration/dependency changes as well as caller-selected sources.
          # Keep project-specific assets/generators in cache-key-files; there is no universal build-input list.
          key: build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles(inputs.cache-key-files, '**/package.json', '**/package-lock.json', '**/npm-shrinkwrap.json', '**/tsconfig*.json', '**/*config.*', inputs.node-version-file) }}
      - name: Install dependencies
        if: ${{ steps.diff.outputs.docs_only != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Required check
        if: ${{ steps.diff.outputs.docs_only != 'true' }}
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
        run: eval "$CHECK_COMMAND"
