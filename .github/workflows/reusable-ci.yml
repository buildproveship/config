# Lean CI for every BuildProveShip repo, called from the repo's own pr.yml (see templates/workflows/pr.yml). The local
# hooks (Husky: pre-commit, commit-msg, pre-push) are the first gate; this is the second, so it only has to confirm.
#
# Cost rules (cap: $10/month of GitHub Actions):
#   - drafts are skipped; the caller also triggers on ready_for_review, so marking ready starts the run
#   - docs-only PRs skip checks; `ci` reports success under that policy and logs that checks were not run
#   - one job, not three: every hosted job bills at least one minute, so classify, check and report run as steps of `ci`
#   - one run per PR (cancel-in-progress): a new push cancels the superseded run. Merge-queue runs (`merge_group`) are
#     never cancelled, because a cancelled queue run ejects the PR from the queue.
#   - dependencies and build output cached
#   - runner routing (owner decision, 28 Nov 2026): `runner: auto` (the default) picks the cheapest runner that can take
#     the job now, in this order: (1) GitHub-hosted `ubuntu-24.04` for public repos and fork PRs (free, and a stranger's
#     code never reaches a machine of ours); (2) the self-hosted `rr-local` Mac when it is online and idle; (3) the
#     `spot-runner` label (an ephemeral AWS spot runner) when the caller sets one; (4) GitHub-hosted `ubuntu-24.04`.
#     GitHub never falls back between labels by itself, so the small `route` job asks the API first. Any other
#     `runner` value is used as given, with no routing.
# Callers grant: permissions: { contents: read, pull-requests: read, packages: read } (packages: npm ci installs
# @buildproveship/config from GitHub Packages, which needs a token even for a public package).
name: Reusable CI
on:
  workflow_call:
    inputs:
      runner:
        description: "`auto` routes to the cheapest available runner (see the header); any other value is a fixed runner label. Fork PRs and public repos always use ubuntu-24.04."
        type: string
        default: auto
      local-runner:
        description: Label of the self-hosted runner that `auto` tries first for private repos.
        type: string
        default: rr-local
      spot-runner:
        description: Label of the ephemeral spot runner `auto` uses when the local runner is offline or busy. Empty means fall back to ubuntu-24.04.
        type: string
        default: ""
      node-version-file:
        type: string
        default: .nvmrc
      check-command:
        description: The one required check; the same command developers run as `npm run check`.
        type: string
        default: npx --no-install buildproveship-hooks verify
      docs-only-pattern:
        description: Extended regex; a PR whose changed files all match it skips the checks.
        type: string
        default: '^(.*\.md|docs/.*|LICENSE)$'
      cache-paths:
        description: Build output to cache between runs, one path per line. Empty means no build cache.
        type: string
        default: ""
      cache-key-files:
        description: Build-input glob (including assets/generators outside src when needed). Shared keys also include manifests, npm locks, configs and the Node version file.
        type: string
        default: "src/**"
    secrets:
      runner-router-client-id:
        description: Client ID of a GitHub App with read-only "Self-hosted runners" organisation permission. Optional; without it `auto` cannot see the local runner and skips it.
        required: false
      runner-router-private-key:
        description: Private key of that App. The App token lives for the job only.
        required: false
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Picks the runner for `ci` (see the header). One short hosted job, skipped for drafts like `ci`.
  route:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      - id: need-token
        name: Need the runner-status token?
        env:
          RUNNER: ${{ inputs.runner }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PRIVATE: ${{ github.event.repository.private }}
          HAS_KEY: ${{ secrets.runner-router-private-key != '' && secrets.runner-router-client-id != '' }}
        run: |
          set -euo pipefail
          if [ "$RUNNER" = auto ] && [ "$FORK" != true ] && [ "$PRIVATE" != false ] && [ "$HAS_KEY" = true ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - id: token
        if: ${{ steps.need-token.outputs.needed == 'true' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.runner-router-client-id }}
          private-key: ${{ secrets.runner-router-private-key }}
          owner: ${{ github.repository_owner }}
          permission-organization-self-hosted-runners: read
      - id: pick
        name: Pick the runner
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUNNER: ${{ inputs.runner }}
          LOCAL: ${{ inputs.local-runner }}
          SPOT: ${{ inputs.spot-runner }}
          OWNER: ${{ github.repository_owner }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          hosted=ubuntu-24.04
          pick() {
            echo "runs-on=$(jq -cn --arg label "$1" '[$label]')" >> "$GITHUB_OUTPUT"
            echo "Runner: $1 ($2)"
            exit 0
          }
          if [ "$RUNNER" != auto ]; then pick "$RUNNER" "fixed by the caller"; fi
          if [ "$FORK" = true ]; then pick "$hosted" "fork PR: never a machine of ours"; fi
          if [ "$PRIVATE" = false ]; then pick "$hosted" "public repo: hosted minutes are free"; fi
          idle=0
          if [ -n "${GH_TOKEN:-}" ]; then
            # An unreadable runner list counts as "no idle runner", never as a failed route.
            idle=$(gh api "orgs/$OWNER/actions/runners" --paginate 2>/dev/null \
              | jq -s --arg label "$LOCAL" '[.[].runners[] | select(.status == "online" and .busy == false and any(.labels[]; .name == $label))] | length' 2>/dev/null) || idle=0
          fi
          if [ "${idle:-0}" -gt 0 ]; then pick "$LOCAL" "online and idle"; fi
          if [ -n "$SPOT" ]; then pick "$SPOT" "local runner offline, busy or not checkable"; fi
          pick "$hosted" "no local or spot runner available"
  # The one required status check (`ci / ci`). Drafts skip it; docs-only changes report the policy exemption.
  ci:
    needs: route
    if: ${{ needs.route.result == 'success' }}
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      # Same script as classify-changes.yml (test/ci-classification.test.js fails if they differ). It runs before
      # checkout, so a docs-only PR bills one short job and never installs anything.
      - id: diff
        name: Classify changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PATTERN: ${{ inputs.docs-only-pattern }}
        run: |
          set -euo pipefail
          # Leave a conservative output even if the API or classifier subsequently fails.
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "pull_request" ]; then exit 0; fi
          # Include both ends of renames: moving code into docs does not remove the need for checks.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          if [ -z "$files" ]; then exit 0; fi
          # Consume all input: grep -q could SIGPIPE printf on a long diff.
          if printf '%s\n' "$files" | grep -Ev -- "$PATTERN" > /dev/null; then
            exit 0
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              echo "docs-only classifier failed (grep exit $result); refusing to skip checks" >&2
              exit "$result"
            fi
          fi
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
      - name: Docs-only policy
        if: ${{ steps.diff.outputs.docs_only == 'true' }}
        run: echo "Checks skipped under the configured docs-only policy; checks were not run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.diff.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
          # Full history so `origin/main` exists: a consumer's check-command can compare against the merge target
          # (test-data-management's openapi:check runs `git ls-tree origin/main`). The credential is not kept, so a
          # script cannot fetch it later.
          fetch-depth: 0
      - id: node
        if: ${{ steps.diff.outputs.docs_only != 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@buildproveship"
      - name: Restore build output
        if: ${{ steps.diff.outputs.docs_only != 'true' && inputs.cache-paths != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          # Invalidate on build configuration/dependency changes as well as caller-selected sources.
          # Keep project-specific assets/generators in cache-key-files; there is no universal build-input list.
          key: build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles(inputs.cache-key-files, '**/package.json', '**/package-lock.json', '**/npm-shrinkwrap.json', '**/tsconfig*.json', '**/*config.*', inputs.node-version-file) }}
      - name: Install dependencies
        if: ${{ steps.diff.outputs.docs_only != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Required check
        if: ${{ steps.diff.outputs.docs_only != 'true' }}
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
        run: eval "$CHECK_COMMAND"
