# Nightly full E2E on the self-hosted runner, called from a repo's schedule workflow (templates/workflows/nightly.yml).
# Never runs for pull requests, so the self-hosted runner never executes code from a fork.
name: Reusable nightly E2E
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: rr-local
      node-version-file:
        type: string
        default: .nvmrc
      e2e-command:
        description: The full suite, the same command developers run as `npm run check:full`.
        type: string
        default: npm run check:full
permissions:
  contents: read
  packages: read
concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  e2e:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@releaseready"
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Full E2E
        env:
          E2E_COMMAND: ${{ inputs.e2e-command }}
        run: eval "$E2E_COMMAND"
