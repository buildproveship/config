# Publishes @buildproveship/config to GitHub Packages when a vX.Y.Z tag is pushed.
# The tag must match package.json "version".
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Release commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse --verify 'HEAD^{commit}')
          main=$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')
          git merge-base --is-ancestor "$candidate" "$main"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@buildproveship"
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: npm ci
      # test/hooks.test.js runs the real pre-commit hook, which needs gitleaks.
      - uses: ./.github/actions/install-gitleaks
      - name: Checks
        run: npm run check
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
