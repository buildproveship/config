# Copy to .github/workflows/pr.yml. Replace <sha> with the full commit sha of the @releaseready/config release tag.
# No `paths-ignore` here: a required check that never starts stays pending, so docs-only PRs are skipped inside the
# workflow, where the required job `ci` still reports.
name: Pull request
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  packages: read
jobs:
  ci:
    uses: buildproveship/config/.github/workflows/reusable-ci.yml@<sha>
