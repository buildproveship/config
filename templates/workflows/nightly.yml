# Copy to .github/workflows/nightly.yml. Replace <sha> with the full commit sha of the @buildproveship/config release tag.
name: Nightly E2E
on:
  schedule:
    - cron: "30 18 * * 0" # Sunday 18:30 UTC, Monday 02:30 Hong Kong time; daily hosted runs burn the Actions budget (RRDPLAT-114)
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  e2e:
    uses: buildproveship/config/.github/workflows/reusable-nightly.yml@<sha>
