# Copy to .github/workflows/copilot-setup-steps.yml. The installer is pinned to an existing Config release.
# The shared installer supplies pinned, checksum-verified gitleaks for the commit hooks.
# The Copilot coding agent runs the `copilot-setup-steps` job
# before it starts, so the agent can run `npx buildproveship-hooks verify` (the same check CI runs) before opening a PR;
# templates/copilot-instructions.md tells it to.
name: Copilot setup steps
on: workflow_dispatch
permissions:
  contents: read
  packages: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@buildproveship"
      - uses: buildproveship/config/.github/actions/install-gitleaks@8c60fd8e1bedfa53f8f5e6ffd3edbab546514d17
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
